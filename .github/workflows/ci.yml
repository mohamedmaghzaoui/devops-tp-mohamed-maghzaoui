name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ai-gen-app
        run: npm install

      - name: Lint
        working-directory: ai-gen-app
        run: npm run lint

      - name: Test
        working-directory: ai-gen-app
        run: npm test

      - name: Build
        working-directory: ai-gen-app
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}